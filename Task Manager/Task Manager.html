<!doctype html>
<html lang="en">
     <head>
          <meta charset="UTF-8" />
          <meta
               name="viewport"
               content="width=device-width, initial-scale=1.0"
          />
          <title>Document</title>
          <style>
               :root {
                    color-scheme: dark;
               }
               * {
                    box-sizing: border-box;
               }
               body {
                    margin: 0;
                    padding: 24px;
                    font-family:
                         system-ui,
                         -apple-system,
                         Segoe UI,
                         Roboto,
                         Arial,
                         sans-serif;
                    background: #0b1020;
                    color: #e9eefc;
               }
               .app {
                    max-width: 1100px;
                    margin: 0 auto;
               }
               .card {
                    background: rgba(255, 255, 255, 0.06);
                    border: 1px solid rgba(255, 255, 255, 0.12);
                    border-radius: 18px;
                    padding: 16px;
               }
               h1 {
                    font-size: 18px;
                    margin: 0;
               }
               .muted {
                    opacity: 0.75;
               }
               .topbar {
                    display: flex;
                    gap: 12px;
                    flex-wrap: wrap;
                    align-items: center;
                    justify-content: space-between;
                    margin-bottom: 12px;
               }
               .row {
                    display: flex;
                    gap: 10px;
                    flex-wrap: wrap;
                    align-items: center;
               }
               .grid {
                    display: grid;
                    grid-template-columns: 0.95fr 1.15fr;
                    gap: 12px;
               }
               @media (max-width: 900px) {
                    .grid {
                         grid-template-columns: 1fr;
                    }
               }
               input,
               textarea {
                    width: 100%;
                    background: rgba(0, 0, 0, 0.25);
                    border: 1px solid rgba(255, 255, 255, 0.16);
                    color: #e9eefc;
                    border-radius: 12px;
                    padding: 10px 12px;
                    outline: none;
               }
               textarea {
                    min-height: 92px;
                    resize: vertical;
               }
               label {
                    font-size: 12px;
                    opacity: 0.85;
                    display: block;
                    margin: 10px 0 6px;
               }
               button {
                    border: 0;
                    border-radius: 12px;
                    padding: 10px 14px;
                    cursor: pointer;
                    background: #4f7cff;
                    color: white;
                    font-weight: 800;
               }
               button.secondary {
                    background: rgba(255, 255, 255, 0.12);
               }
               button.danger {
                    background: #ff4f6d;
               }
               button:disabled {
                    opacity: 0.6;
                    cursor: not-allowed;
               }
               .pill {
                    display: inline-block;
                    padding: 3px 10px;
                    border-radius: 999px;
                    font-size: 12px;
                    background: rgba(255, 255, 255, 0.1);
                    border: 1px solid rgba(255, 255, 255, 0.14);
                    opacity: 0.9;
               }
               .filters button {
                    padding: 8px 12px;
                    font-size: 13px;
               }
               .filters button.active {
                    outline: 2px solid rgba(79, 124, 255, 0.65);
               }
               .status {
                    display: none;
                    gap: 10px;
                    align-items: center;
                    margin-top: 10px;
               }
               .spinner {
                    width: 16px;
                    height: 16px;
                    border-radius: 999px;
                    border: 2px solid rgba(255, 255, 255, 0.25);
                    border-top-color: white;
                    animation: spin 0.85s linear infinite;
               }
               @keyframes spin {
                    to {
                         transform: rotate(360deg);
                    }
               }
               .error {
                    display: none;
                    margin-top: 10px;
                    padding: 10px 12px;
                    border-radius: 14px;
                    border: 1px solid rgba(255, 79, 109, 0.45);
                    background: rgba(255, 79, 109, 0.12);
                    line-height: 1.4;
               }
               .list {
                    display: grid;
                    gap: 10px;
                    margin-top: 10px;
               }
               .empty {
                    padding: 14px;
                    opacity: 0.8;
                    border-radius: 14px;
                    border: 1px dashed rgba(255, 255, 255, 0.18);
               }
               .task {
                    border-radius: 16px;
                    padding: 12px;
                    border: 1px solid rgba(255, 255, 255, 0.12);
                    display: grid;
                    grid-template-columns: 1fr auto;
                    gap: 10px;
                    align-items: start;
               }
               .task.pending {
                    background: rgba(255, 214, 79, 0.14);
                    border-color: rgba(255, 214, 79, 0.3);
               }
               .task.done {
                    background: rgba(79, 255, 154, 0.12);
                    border-color: rgba(79, 255, 154, 0.28);
               }
               .task h3 {
                    margin: 0 0 6px;
                    font-size: 15px;
                    font-weight: 950;
                    letter-spacing: 0.2px;
               }
               .task p {
                    margin: 0;
                    opacity: 0.85;
                    line-height: 1.45;
                    white-space: pre-wrap;
                    word-break: break-word;
               }
               .meta {
                    margin-top: 8px;
                    display: flex;
                    gap: 8px;
                    flex-wrap: wrap;
                    align-items: center;
               }
               .actions {
                    display: flex;
                    gap: 8px;
                    align-items: center;
               }
               .actions button {
                    padding: 8px 10px;
                    font-size: 13px;
                    white-space: nowrap;
               }
               .toast {
                    position: fixed;
                    right: 18px;
                    bottom: 18px;
                    background: rgba(0, 0, 0, 0.55);
                    border: 1px solid rgba(255, 255, 255, 0.18);
                    backdrop-filter: blur(10px);
                    padding: 12px 14px;
                    border-radius: 14px;
                    display: none;
                    max-width: 380px;
                    line-height: 1.35;
               }
          </style>
     </head>
     <body>
          <div class="app">
               <div class="card">
                    <div class="topbar">
                         <div>
                              <h1>Task Manager (IndexedDB)</h1>
                              <div class="muted">
                                   One page • Modern UI • Persisted locally
                                   (refresh-safe)
                              </div>
                         </div>
                         <div class="row">
                              <span class="pill" id="stats"
                                   >Total: 0 • Pending: 0 • Done: 0</span
                              >
                              <button class="secondary" id="btnSeed">
                                   Seed
                              </button>
                              <button class="secondary" id="btnClearAll">
                                   Clear All
                              </button>
                         </div>
                    </div>
                    <div
                         class="row"
                         style="
                              justify-content: space-between;
                              margin-bottom: 10px;
                         "
                    >
                         <div class="row filters" id="filters">
                              <button
                                   class="secondary active"
                                   data-filter="all"
                              >
                                   All
                              </button>
                              <button class="secondary" data-filter="pending">
                                   Pending
                              </button>
                              <button class="secondary" data-filter="done">
                                   Done
                              </button>
                         </div>

                         <div class="row" style="min-width: 280px">
                              <input
                                   id="search"
                                   placeholder="Search title/description…"
                              />
                         </div>
                    </div>

                    <div class="status muted" id="loading">
                         <div class="spinner"></div>
                         <div>Loading…</div>
                    </div>

                    <div class="error" id="error"></div>

                    <div class="grid" style="margin-top: 12px">
                         <section class="card" style="padding: 14px">
                              <strong>Add New Task</strong>
                              <div class="muted" style="margin-top: 6px">
                                   Pending tasks are
                                   <span class="pill">Yellow</span>. Mark done
                                   to turn <span class="pill">Green</span>.
                              </div>

                              <label for="title">Title (required)</label>
                              <input
                                   id="title"
                                   maxlength="80"
                                   placeholder="e.g., Record DOM lesson video"
                              />

                              <label for="desc"
                                   >Description (optional, max 300)</label
                              >
                              <textarea
                                   id="desc"
                                   maxlength="300"
                                   placeholder="Details…"
                              ></textarea>

                              <div
                                   class="row"
                                   style="
                                        justify-content: flex-end;
                                        margin-top: 12px;
                                   "
                              >
                                   <button class="secondary" id="btnReset">
                                        Reset
                                   </button>
                                   <button id="btnAdd">Add Task</button>
                              </div>

                              <div class="muted" style="margin-top: 10px">
                                   Tip: Press <span class="pill">Ctrl</span> +
                                   <span class="pill">Enter</span> to add
                                   quickly.
                              </div>
                         </section>
                         <section>
                              <div
                                   class="row"
                                   style="justify-content: space-between"
                              >
                                   <div class="row">
                                        <strong>Tasks</strong>
                                        <span class="muted" id="shown"></span>
                                   </div>
                              </div>

                              <div class="list" id="list"></div>
                         </section>
                    </div>
               </div>
          </div>
          <div class="toast" id="toast"></div>

          <script>
               const UI = {
                    loading: document.getElementById("loading"),
                    error: document.getElementById("error"),
                    toast: document.getElementById("toast"),

                    stats: document.getElementById("stats"),
                    shown: document.getElementById("shown"),

                    filters: document.getElementById("filters"),
                    search: document.getElementById("search"),

                    title: document.getElementById("title"),
                    desc: document.getElementById("desc"),
                    btnAdd: document.getElementById("btnAdd"),
                    btnReset: document.getElementById("btnReset"),

                    btnSeed: document.getElementById("btnSeed"),
                    btnClearAll: document.getElementById("btnClearAll"),
                    list: document.getElementById("list"),
               };
               let db = null;
               let tasks = [];
               let currentFilter = "all";
               function showToast(message) {
                    UI.toast.textContent = message;
                    UI.toast.style.display = "block";
                    setTimeout(() => (UI.toast.style.display = "none"), 2200);
               }
               function setLoading(isLoading) {
                    UI.loading.style.display = isLoading ? "flex" : "none";
                    UI.btnAdd.disabled = isLoading;
                    UI.btnSeed.disabled = isLoading;
                    UI.btnClearAll.disabled = isLoading;
               }
               function setError(message) {
                    UI.error.textContent = message || "";
                    UI.error.style.display = message ? "block" : "none";
               }
               function esc(s) {
                    return String(s ?? "")
                         .replaceAll("&", "&amp;")
                         .replaceAll("<", "&lt;")
                         .replaceAll(">", "&gt;")
                         .replaceAll('"', "&quot;")
                         .replaceAll("'", "&#039;");
               }
               function formatDate(ms) {
                    return new Date(ms).toLocaleString();
               }
               function openDB() {
                    return new Promise((resolve, reject) => {
                         const request = indexedDB.open("TaskDB", 1);
                         request.onupgradeneeded = () => {
                              const db = request.result;
                              const store = db.createObjectStore("tasks", {
                                   keyPath: "id",
                                   autoIncrement: true,
                              });
                              store.createIndex("status", "status", {
                                   unique: false,
                              });
                              store.createIndex("createdAt", "createdAt", {
                                   unique: false,
                              });
                         };
                         request.onsuccess = () => resolve(request.result);
                         request.onerror = () =>
                              reject(
                                   request.error ||
                                        new Error("Failed To Open IndexedDB"),
                              );
                    });
               }
               function tx(storeName, mode = "readonly") {
                    const transaction = db.transaction(storeName, mode);
                    return transaction.objectStore(storeName);
               }
               function idbRequestToPromise(request) {
                    return new Promise((resolve, reject) => {
                         request.onsuccess = () => resolve(request.result);
                         request.onerror = () =>
                              reject(
                                   request.error ||
                                        new Error("IndexedDB Request Failed"),
                              );
                    });
               }
               async function readAllTasks() {
                    const store = tx("tasks", "readonly");
                    const all = await idbRequestToPromise(store.getAll());
                    all.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                    return all;
               }
               async function createTask({ title, description }) {
                    const now = Date.now();
                    const task = {
                         title,
                         description,
                         status: "pending",
                         createdAt: now,
                         updatedAt: now,
                    };
                    const store = tx("tasks", "readwrite");
                    const id = await idbRequestToPromise(store.add(task));
                    return { ...task, id };
               }
               async function updateTask(id, patch) {
                    const store = tx("tasks", "readwrite");
                    const existing = await idbRequestToPromise(store.get(id));
                    if (!existing) throw new Error("Task Not Found");
                    const updated = {
                         ...existing,
                         ...patch,
                         updatedAt: Date.now(),
                    };
                    await idbRequestToPromise(store.put(updated));
                    return updated;
               }
               async function deleteTask(id) {
                    const store = tx("tasks", "readwrite");
                    await idbRequestToPromise(store.delete(id));
               }
               async function clearAllTasks() {
                    const store = tx("tasks", "readwrite");
                    await idbRequestToPromise(store.clear());
               }
               function validateInput() {
                    const title = UI.title.value.trim();
                    const description = UI.desc.value.trim();
                    if (!title) {
                         return { ok: false, message: "Title Is Required" };
                    }
                    if (title.length < 3) {
                         return {
                              ok: false,
                              message: "Title Must Be At Least 3 Characters",
                         };
                    }
                    if (description.length > 300) {
                         return {
                              ok: false,
                              message: "Description Must Be 300 Characters Or Less",
                         };
                    }
                    return { ok: true, title, description };
               }
               function getVisibleTasks() {
                    const q = UI.search.value.trim().toLowerCase();
                    return tasks.filter((t) => {
                         const matchesFilter =
                              currentFilter === "all"
                                   ? true
                                   : t.status === currentFilter;

                         const matchesSearch = !q
                              ? true
                              : (t.title || "").toLowerCase().includes(q) ||
                                (t.description || "").toLowerCase().includes(q);
                                return matchesFilter && matchesSearch;
                    });
                    
               }
               function render() {
                    const visible = getVisibleTasks();
                    const total = tasks.length;
                    const pending = tasks.filter(
                         (t) => t.status === "pending",
                    ).length;
                    const done = tasks.filter(
                         (t) => t.status === "done",
                    ).length;
                    UI.stats.textContent = `Total: ${total.toLocaleString()} • Pending: ${pending.toLocaleString()} • Done: ${done.toLocaleString()}`;
                    UI.shown.textContent = `${visible.length.toLocaleString()} shown`;
                    if (visible.length === 0) {
                         UI.list.innerHTML = `<div class="empty muted">No tasks match your filter/search.</div>`;
                         return;
                    }
                    UI.list.innerHTML = visible
                         .map((t) => {
                              const isDone = t.status === "done";
                              const badge = isDone ? "Done" : "Pending";
                              const toggleLabel = isDone
                                   ? "Mark Pending ↩️"
                                   : "Mark Done ✅";
                              const statusClass = isDone ? "done" : "pending";
                              return `
              <div class="task ${statusClass}" data-id="${t.id}">
                <div>
                  <h3>${esc(t.title)}</h3>
                  <p>${esc(t.description || "—")}</p>

                  <div class="meta">
                    <span class="pill">#${t.id}</span>
                    <span class="pill">${badge}</span>
                    <span class="pill">Created: ${esc(
                         formatDate(t.createdAt),
                    )}</span>
                  </div>
                </div>

                <div class="actions">
                  <button class="secondary" data-action="toggle">${toggleLabel}</button>
                  <button class="danger" data-action="delete">Delete 🗑️</button>
                </div>
              </div>
            `;
                         })
                         .join("");
               }
               async function handleAdd() {
                    setError("");

                    const v = validateInput();
                    if (!v.ok) return setError(v.message);

                    // ✅ block double click
                    UI.btnAdd.disabled = true;

                    try {
                         const created = await createTask({
                              title: v.title,
                              description: v.description,
                         });

                         // ✅ Put newest task at top
                         tasks.unshift(created);

                         // ✅ Clear form
                         UI.title.value = "";
                         UI.desc.value = "";

                         render();
                         showToast("✅ Task added");
                    } catch (e) {
                         setError(`❌ Add failed: ${e.message}`);
                    } finally {
                         UI.btnAdd.disabled = false;
                    }
               }
               async function handleToggle(id) {
                    setError("");

                    const idx = tasks.findIndex((t) => t.id === id);
                    if (idx === -1) return;

                    // ✅ Backup for revert if DB fails
                    const old = { ...tasks[idx] };

                    // ✅ New status
                    const newStatus =
                         old.status === "done" ? "pending" : "done";

                    // ✅ Optimistic UI update (fast feeling)
                    tasks[idx] = {
                         ...tasks[idx],
                         status: newStatus,
                         updatedAt: Date.now(),
                    };
                    render();

                    try {
                         await updateTask(id, { status: newStatus });
                         showToast(
                              newStatus === "done"
                                   ? "✅ Marked as done"
                                   : "✅ Marked as pending",
                         );
                    } catch (e) {
                         // ✅ Revert if failed
                         tasks[idx] = old;
                         render();

                         setError(`❌ Update failed: ${e.message}`);
                         showToast("❌ Update failed (reverted)");
                    }
               }
               async function handleDelete(id) {
                    setError("");

                    const t = tasks.find((x) => x.id === id);
                    if (!t) return;

                    // ✅ confirm is safer than instant delete
                    if (!confirm(`Delete this task?\n\n"${t.title}"`)) return;

                    // ✅ Optimistic remove (feels instant)
                    const backup = [...tasks];
                    tasks = tasks.filter((x) => x.id !== id);
                    render();

                    try {
                         await deleteTask(id);
                         showToast("✅ Task deleted");
                    } catch (e) {
                         // ✅ revert if DB fails
                         tasks = backup;
                         render();

                         setError(`❌ Delete failed: ${e.message}`);
                         showToast("❌ Delete failed (reverted)");
                    }
               }
               async function handleSeed() {
                    setError("");
                    const samples = [
                         {
                              title: "Record Lesson: Event Delegation",
                              description:
                                   "Add examples with bubbling and delegation",
                         },
                         {
                              title: "Build IndexedDB Task Project",
                              description:
                                   "CRUD + search + filters + modern cards.",
                         },
                         {
                              title: "Prepare quiz questions",
                              description:
                                   "Mix MCQ and true/false for DOM lessons.",
                         },
                    ];
                    UI.btnSeed.disabled = true;
                    try {
                         for (const s of samples) {
                              const created = await createTask({
                                   title: s.title,
                                   description: s.description,
                              });
                              tasks.unshift(created);
                         }
                         render();
                         showToast("Seeded Smaples Tasks Successfully");
                    } catch (e) {
                         setError(`Seed Failed: ${e.message}`);
                    } finally {
                         UI.btnSeed.disabled = false;
                    }
               }
               async function handleClearAll() {
                    setError("");
                    if (
                         !confirm("Clear All Tasks? \n\nThis Cannot Be Undone")
                    ) {
                         return;
                    }
                    UI.btnClearAll.disabled = true;
                    try {
                         await clearAllTasks();
                         tasks = [];
                         render();
                         showToast("All Tasks Cleared");
                    } catch (e) {
                         setError(`Clear Failed: ${e.message}`);
                    } finally {
                         UI.btnClearAll.disabled = false;
                    }
               }
               function resetForm() {
                    UI.title.value = "";
                    UI.desc.value = "";
                    setError("");
               }
               UI.list.addEventListener("click", (event) => {
                    const btn = event.target.closest("button");
                    if (!btn) return;

                    const card = event.target.closest(".task");
                    if (!card) return;

                    const id = Number(card.dataset.id);
                    const action = btn.dataset.action;

                    if (action === "toggle") handleToggle(id);
                    if (action === "delete") handleDelete(id);
               });
               UI.filters.addEventListener("click", (event) => {
                    const btn = event.target.closest("button");
                    if (!btn) return;
                    currentFilter = btn.dataset.filter;
                    [...UI.filters.querySelectorAll("button")].forEach((b) =>
                         b.classList.remove("active"),
                    );
                    btn.classList.add("active");
                    render();
               });
               UI.search.addEventListener("input", render);
               UI.btnAdd.addEventListener("click", handleAdd);
               UI.btnReset.addEventListener("click", resetForm);
               UI.btnSeed.addEventListener("click", handleSeed);
               UI.btnClearAll.addEventListener("click", handleClearAll);
               window.addEventListener("keydown", (e) => {
                    if (e.ctrlKey && e.key === "Enter") handleAdd();
               });
               (async function boot() {
                    setLoading(true);
                    setError("");

                    try {
                         db = await openDB();
                         tasks = await readAllTasks();
                         render();
                    } catch (e) {
                         setError(`Failed To Initialize App: ${e.message}`);
                    } finally {
                         setLoading(false);
                    }
               })();
          </script>
     </body>
</html>
